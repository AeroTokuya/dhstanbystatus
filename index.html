<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドクターヘリ 出動受付状況</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: bold;
      color: #1a1a2e;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 32px 24px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .base-name {
      font-size: 1rem;
      color: #555;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 36px;
      border-radius: 999px;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .status-badge.available   { background: #e6f9ee; color: #0a8f4c; border: 2px solid #0a8f4c; }
    .status-badge.conditional { background: #fff8e1; color: #c87800; border: 2px solid #f0a500; }
    .status-badge.unavailable { background: #fdecea; color: #c0392b; border: 2px solid #c0392b; }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .available   .status-dot { background: #0a8f4c; animation: pulse-green  1.8s infinite; }
    .conditional .status-dot { background: #f0a500; animation: pulse-orange 1.8s infinite; }
    .unavailable .status-dot { background: #c0392b; }

    @keyframes pulse-green  { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
    @keyframes pulse-orange { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }

    .note-box {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: none;
      text-align: left;
    }
    .note-box.conditional { background:#fff8e1; border:1px solid #f0c040; color:#7a5c00; }
    .note-box.unavailable { background:#fdecea; border:1px solid #e57373; color:#8b1a1a; }

    .updated-at { font-size: 0.8rem; color: #999; margin-top: 8px; }

    /* 管理者ボタン */
    .admin-toggle {
      margin-top: 40px;
      background: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 0.8rem;
      color: #aaa;
      cursor: pointer;
    }
    .admin-toggle:hover { color: #666; border-color: #999; }

    /* パスワードモーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      text-align: center;
    }

    .modal h3 { font-size: 1rem; color: #333; margin-bottom: 18px; }

    .modal input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      color: #333;
      margin-bottom: 10px;
    }
    .modal input[type="password"]:focus { outline: none; border-color: #1a5fb4; }

    .modal-error {
      font-size: 0.82rem;
      color: #c0392b;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    .modal-btns { display: flex; gap: 10px; }

    .btn-modal-ok {
      flex: 1;
      padding: 11px;
      background: #1a5fb4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-modal-ok:hover { background: #1448a0; }

    .btn-modal-cancel {
      flex: 1;
      padding: 11px;
      background: #f0f0f0;
      color: #555;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-modal-cancel:hover { background: #e0e0e0; }

    /* 管理者パネル */
    .admin-panel {
      display: none;
      margin-top: 16px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }

    .admin-panel h2 { font-size: 0.95rem; color: #444; margin-bottom: 16px; text-align: center; }

    .admin-panel label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    .status-options { display: flex; flex-direction: column; gap: 10px; }

    .status-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid #ddd;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.95rem;
      font-weight: 500;
      color: #444;
      background: #fafafa;
    }
    .status-option input[type="radio"] { display: none; }
    .status-option.sel-available   { border-color: #0a8f4c; background: #e6f9ee; color: #0a8f4c; }
    .status-option.sel-conditional { border-color: #f0a500; background: #fff8e1; color: #c87800; }
    .status-option.sel-unavailable { border-color: #c0392b; background: #fdecea; color: #c0392b; }

    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot.available   { background: #0a8f4c; }
    .dot.conditional { background: #f0a500; }
    .dot.unavailable { background: #c0392b; }

    .admin-panel input[type="text"],
    .admin-panel input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
    }
    .admin-panel input::placeholder { color: #bbb; }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 24px 0 8px;
    }

    .section-title {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 4px;
    }

    .pw-row { display: flex; gap: 8px; margin-top: 6px; }
    .pw-row input { flex: 1; }

    .pw-error { font-size: 0.8rem; color: #c0392b; margin-top: 6px; min-height: 1.1em; }

    .btn-save {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #1a5fb4;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #1448a0; }

    .btn-pw-change {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      background: #f0f0f0;
      color: #555;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-pw-change:hover { background: #e0e0e0; }

    .save-msg { margin-top: 10px; text-align: center; font-size: 0.85rem; color: #0a8f4c; display: none; }
    .pw-save-msg { margin-top: 6px; text-align: center; font-size: 0.82rem; color: #0a8f4c; display: none; }
  </style>
</head>
<body>

  <header>
    <h1>ドクターヘリ 出動受付状況</h1>
    <p id="current-date"></p>
  </header>

  <!-- 表示カード -->
  <div class="card">
    <div class="base-name">◯◯病院ヘリポート</div>
    <div class="status-badge available" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">出動可能</span>
    </div>
    <div class="note-box" id="note-box"></div>
    <div class="updated-at" id="updated-at">最終更新：—</div>
  </div>

  <!-- 管理者ボタン -->
  <button class="admin-toggle" id="admin-toggle-btn">管理者</button>

  <!-- パスワードモーダル -->
  <div class="modal-overlay" id="pw-modal">
    <div class="modal">
      <h3>管理者パスワードを入力してください</h3>
      <input type="password" id="modal-pw-input" placeholder="パスワード" autocomplete="current-password">
      <div class="modal-error" id="modal-error"></div>
      <div class="modal-btns">
        <button class="btn-modal-cancel" id="btn-modal-cancel">キャンセル</button>
        <button class="btn-modal-ok" id="btn-modal-ok">開く</button>
      </div>
    </div>
  </div>

  <!-- 管理者パネル -->
  <div class="admin-panel" id="admin-panel">
    <h2>状況を更新する</h2>

    <label>受付ステータス</label>
    <div class="status-options">
      <label class="status-option" id="opt-available">
        <input type="radio" name="status" value="available" checked>
        <span class="dot available"></span>出動可能
      </label>
      <label class="status-option" id="opt-conditional">
        <input type="radio" name="status" value="conditional">
        <span class="dot conditional"></span>条件付き出動可能
      </label>
      <label class="status-option" id="opt-unavailable">
        <input type="radio" name="status" value="unavailable">
        <span class="dot unavailable"></span>出動不可
      </label>
    </div>

    <label for="input-note">備考・条件（任意）</label>
    <input type="text" id="input-note" placeholder="例：視界不良のため夜間のみ制限">

    <button class="btn-save" id="btn-save">更新する</button>
    <div class="save-msg" id="save-msg">更新しました</div>

    <!-- パスワード変更 -->
    <hr class="divider">
    <div class="section-title">パスワード変更</div>
    <div class="pw-row">
      <input type="password" id="pw-new" placeholder="新しいパスワード" autocomplete="new-password">
      <input type="password" id="pw-new-confirm" placeholder="確認" autocomplete="new-password">
    </div>
    <div class="pw-error" id="pw-error"></div>
    <button class="btn-pw-change" id="btn-pw-change">パスワードを変更する</button>
    <div class="pw-save-msg" id="pw-save-msg">パスワードを変更しました</div>
  </div>

  <script>
    const STORAGE_KEY    = 'drheli_status';
    const PW_KEY         = 'drheli_pw_hash';
    const DEFAULT_PW     = 'admin1234';

    const STATUS_MAP = {
      available:   { label: '出動可能',        badgeClass: 'available',   noteClass: '' },
      conditional: { label: '条件付き出動可能', badgeClass: 'conditional', noteClass: 'conditional' },
      unavailable: { label: '出動不可',         badgeClass: 'unavailable', noteClass: 'unavailable' }
    };

    // SHA-256 ハッシュ（Web Crypto API）
    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256',
        new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function getStoredHash() {
      const stored = localStorage.getItem(PW_KEY);
      if (stored) return stored;
      const def = await sha256(DEFAULT_PW);
      localStorage.setItem(PW_KEY, def);
      return def;
    }

    async function checkPassword(input) {
      const [inputHash, storedHash] = await Promise.all([sha256(input), getStoredHash()]);
      return inputHash === storedHash;
    }

    function nowStr() {
      return new Date().toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function updateDisplay(data) {
      const info = STATUS_MAP[data.status] || STATUS_MAP.available;
      const badge = document.getElementById('status-badge');
      badge.className = 'status-badge ' + info.badgeClass;
      document.getElementById('status-text').textContent = info.label;

      const noteBox = document.getElementById('note-box');
      if (data.note && data.status !== 'available') {
        noteBox.className = 'note-box ' + info.noteClass;
        noteBox.textContent = data.note;
        noteBox.style.display = 'block';
      } else {
        noteBox.style.display = 'none';
      }

      document.getElementById('updated-at').textContent =
        '最終更新：' + (data.updatedAt || '—');
    }

    function loadStatus() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { status: 'available', note: '', updatedAt: null };
    }

    function saveStatus(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function refreshOptionStyles(selected) {
      ['available', 'conditional', 'unavailable'].forEach(v => {
        document.getElementById('opt-' + v).className =
          'status-option' + (v === selected ? ' sel-' + v : '');
      });
    }

    function openAdminPanel() {
      const initial = loadStatus();
      document.querySelector(`input[value="${initial.status}"]`).checked = true;
      document.getElementById('input-note').value = initial.note || '';
      refreshOptionStyles(initial.status);
      document.getElementById('admin-panel').style.display = 'block';
    }

    // 初期表示
    const initial = loadStatus();
    updateDisplay(initial);

    document.getElementById('current-date').textContent =
      new Date().toLocaleDateString('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
      });

    // ラジオ変更
    document.querySelectorAll('input[name="status"]').forEach(r => {
      r.addEventListener('change', () => refreshOptionStyles(r.value));
    });

    // 管理者ボタン → モーダル表示
    document.getElementById('admin-toggle-btn').addEventListener('click', () => {
      if (document.getElementById('admin-panel').style.display === 'block') {
        document.getElementById('admin-panel').style.display = 'none';
        return;
      }
      document.getElementById('modal-pw-input').value = '';
      document.getElementById('modal-error').textContent = '';
      document.getElementById('pw-modal').classList.add('open');
      setTimeout(() => document.getElementById('modal-pw-input').focus(), 50);
    });

    // モーダル：キャンセル
    document.getElementById('btn-modal-cancel').addEventListener('click', () => {
      document.getElementById('pw-modal').classList.remove('open');
    });

    // モーダル：OK
    document.getElementById('btn-modal-ok').addEventListener('click', async () => {
      const input = document.getElementById('modal-pw-input').value;
      if (!input) {
        document.getElementById('modal-error').textContent = 'パスワードを入力してください';
        return;
      }
      const ok = await checkPassword(input);
      if (ok) {
        document.getElementById('pw-modal').classList.remove('open');
        openAdminPanel();
      } else {
        document.getElementById('modal-error').textContent = 'パスワードが正しくありません';
        document.getElementById('modal-pw-input').value = '';
        document.getElementById('modal-pw-input').focus();
      }
    });

    // Enterキーでモーダル確定
    document.getElementById('modal-pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-modal-ok').click();
    });

    // オーバーレイクリックでモーダルを閉じる
    document.getElementById('pw-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget)
        document.getElementById('pw-modal').classList.remove('open');
    });

    // 状況更新
    document.getElementById('btn-save').addEventListener('click', () => {
      const status = document.querySelector('input[name="status"]:checked').value;
      const data = {
        status,
        note: document.getElementById('input-note').value.trim(),
        updatedAt: nowStr()
      };
      saveStatus(data);
      updateDisplay(data);
      const msg = document.getElementById('save-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2000);
    });

    // パスワード変更
    document.getElementById('btn-pw-change').addEventListener('click', async () => {
      const newPw      = document.getElementById('pw-new').value;
      const newConfirm = document.getElementById('pw-new-confirm').value;
      const errEl      = document.getElementById('pw-error');

      if (!newPw) {
        errEl.textContent = '新しいパスワードを入力してください'; return;
      }
      if (newPw.length < 4) {
        errEl.textContent = '4文字以上で設定してください'; return;
      }
      if (newPw !== newConfirm) {
        errEl.textContent = 'パスワードが一致しません'; return;
      }

      errEl.textContent = '';
      const hash = await sha256(newPw);
      localStorage.setItem(PW_KEY, hash);
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-new-confirm').value = '';
      const msg = document.getElementById('pw-save-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2000);
    });
  </script>

</body>
</html>
